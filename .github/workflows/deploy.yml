# Builds the static site and publishes it to GitHub Pages on every push to main.
# One-time setup on github.com: Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Project pages live at https://<user>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}
      # Test copy: keep it out of search engines until launch.
      - name: Block search engines
        run: "printf 'User-agent: *\\nDisallow: /\\n' > build/robots.txt"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
